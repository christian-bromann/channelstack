[package]
name = "channelstack"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Test AI agents that live in Slack, GitHub, Linear and Notion: the channelstack Rust SDK"
repository = "https://github.com/christian-bromann/channelstack"

[dependencies]
base64 = "=0.23.1"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
