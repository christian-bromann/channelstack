[project]
name = "channelstack"
version = "0.1.1"
description = "Test the apps and agents you build for Slack, GitHub, Linear, Notion, Resend, Gmail and Discord: the channelstack Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["testing", "slack", "github", "linear", "notion", "email", "agents", "fake", "test-harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# A published library takes a range: the lock file pins what CI tests (docs/decisions/0023-releases.md).
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://channelstack.dev"
Documentation = "https://channelstack.dev/docs"
Repository = "https://github.com/christian-bromann/channelstack"
Issues = "https://github.com/christian-bromann/channelstack/issues"
Changelog = "https://github.com/christian-bromann/channelstack/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==8.4.2",
    "pyyaml==6.0.4",
    "ruff==0.17.6",
    "types-pyyaml==6.0.12.20261113",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["channelstack"]

[tool.ruff]
line-length = 120
extend-exclude = ["channelstack/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["ASYNC109", "S101", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["channelstack"]

[tool.pyright]
include = ["channelstack", "tests", "../../scenarios/runners/python"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
