[project]
name = "pytest-channelstack"
version = "0.1.1"
description = "pytest fixtures and expect(...) checks for channelstack: test the apps and agents you build for Slack, GitHub, Linear, Notion, Resend and Gmail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["pytest", "testing", "slack", "github", "linear", "notion", "email", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# The SDK of the same release; the rest take a range, and the lock file pins what CI tests
# (docs/decisions/0023-releases.md).
dependencies = ["channelstack==0.1.1", "pytest>=8.4.2,<9", "pytest-asyncio>=1.4.1,<2"]

[project.urls]
Homepage = "https://channelstack.dev"
Documentation = "https://channelstack.dev/docs"
Repository = "https://github.com/christian-bromann/channelstack"
Issues = "https://github.com/christian-bromann/channelstack/issues"
Changelog = "https://github.com/christian-bromann/channelstack/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
channelstack = "pytest_channelstack.plugin"

[dependency-groups]
dev = ["pyright==1.1.414", "ruff==0.17.6"]

[tool.uv.sources]
channelstack = { path = "../../sdks/python", editable = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytest_channelstack"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["ASYNC109", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["channelstack", "pytest_channelstack"]

[tool.pyright]
include = [
  "pytest_channelstack",
  "tests",
  "../../test/acceptance/pytest",
  "../../website/samples/python",
  "../../website/examples/python",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
