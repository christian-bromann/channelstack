[project]
name = "pytest-channelstack"
version = "0.0.0"
description = "pytest fixtures and expect(...) checks for channelstack: test AI agents in Slack, GitHub, Linear and Notion."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["channelstack", "pytest==8.4.2", "pytest-asyncio==1.4.1"]

[project.entry-points.pytest11]
channelstack = "pytest_channelstack.plugin"

[dependency-groups]
dev = ["pyright==1.1.414", "ruff==0.17.6"]

[tool.uv.sources]
channelstack = { path = "../../sdks/python", editable = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytest_channelstack"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["ASYNC109", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["channelstack", "pytest_channelstack"]

[tool.pyright]
include = ["pytest_channelstack", "tests", "../../test/acceptance/pytest", "../../website/samples/python"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
