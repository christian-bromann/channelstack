# The pytest port of the Slack conversation tests (exit check 7.3). `scripts/accept.ts` runs it
# against the Bolt reference agent, with CHANNELSTACK_HOME pointing at the server it started.
[pytest]
# One event loop for the whole run: the client the `channelstack` fixture holds lives as long as the run.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
channelstack_mode = attach
