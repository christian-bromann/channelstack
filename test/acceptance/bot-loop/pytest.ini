# `test_loop.py`, run by `../plugin-defaults.test.ts` with CHANNELSTACK_HOME pointing at its server.
[pytest]
# One event loop for the whole run: the client the `channelstack` fixture holds lives as long as the run.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
channelstack_mode = attach
