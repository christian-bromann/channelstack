name: google/reply
description: A person emails the agent and the agent answers in the thread. Runs against the fake and against the sandbox mailboxes (the differential run).
requires: [google-agent]
# What the coverage page credits this scenario with (`Type.method`, as the spec names them).
covers: [GoogleFixture.createUser, GoogleUser.send, GoogleThread.replies, GoogleThread.messages]
steps:
  - call: session.google
    as: google
  - call: google.createUser
    options: { name: Ana }
    as: ana
  - call: ana.send
    options: { to: [$google.app], subject: Conformance smoke test, text: Where is my refund? }
    as: email
  - call: email.thread.waitForReply
    options: { from: $google.app, timeout: 90s }
    as: answer
  - call: email.thread.replies
    as: replies
  - call: email.thread.messages
    as: messages
  - record:
      replies: $replies
      messages: $messages
