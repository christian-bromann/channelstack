name: slack/mention
description: A person mentions the app in a channel and the agent answers in the thread. Runs against the fake and against the sandbox (the differential run).
requires: [slack-agent]
# What the coverage page credits this scenario with (`Type.method`, as the spec names them).
covers: [SlackFixture.createUser, SlackFixture.createChannel, SlackUser.say, SlackThread.replies, SlackThread.root]
steps:
  - call: session.slack
    as: slack
  - call: slack.createUser
    options: { name: Ana }
    as: ana
  - call: slack.createChannel
    options: { participants: [$ana, $slack.app] }
    as: channel
  - call: ana.say
    args: ["@my-agent summarize #support today"]
    options: { channel: $channel }
    as: message
  - call: message.thread.waitForReply
    options: { from: my-agent, timeout: 60s }
    as: reply
  - call: message.thread.replies
    as: replies
  # The reply's thread starts with the question.
  - call: reply.thread.root
    as: root
  - expect:
      - value: $root.ts
        equals: $message.ts
      - value: $root.text
        equals: $message.text
  - record:
      question: $message
      replies: $replies
