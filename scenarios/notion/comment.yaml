name: notion/comment
description: A person asks the integration about a page in a comment and the agent replies in the discussion. Runs against the fake and against the test workspace (the differential run).
requires: [notion-agent]
# What the coverage page credits this scenario with (`Type.method`, as the spec names them).
covers: [NotionFixture.createUser, NotionUser.createPage, NotionUser.comment, NotionDiscussion.comments]
steps:
  - call: session.notion
    as: notion
  - call: notion.createUser
    options: { name: Ana }
    as: ana
  # Ana makes the page, so Notion tells the integration in both worlds (the fixture's seeds are
  # silent in the fake, and made by a real person live).
  - call: ana.createPage
    args: [{ title: Conformance smoke test, connections: [$notion.app] }]
    as: page
  # A page in the page, so the agent's read of the page's blocks lists a child_page in both worlds.
  - call: ana.createPage
    args: [{ title: Conformance subpage, parent: $page }]
    as: subpage
  - call: ana.comment
    args: ["@my-agent summarize this page"]
    options: { page: $page }
    as: question
  - call: question.discussion.waitForComment
    options: { from: $notion.app, timeout: 60s }
    as: answer
  - call: question.discussion.comments
    as: comments
  - record:
      comments: $comments
