[package]
name = "channelstack-smoke"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Runs a smoke scenario through the channelstack Rust SDK"

[dependencies]
channelstack = { path = "../../../sdks/rust" }
regex = "=1.13.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
yaml-rust2 = "=0.13.0"
