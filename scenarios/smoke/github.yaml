name: github
description: The generated GitHub methods in every SDK. A repository is created with files, read back through the SDK, and a person opens, labels, comments on and closes an issue in it; the App isn't installed on it. Runs against a server the SDK's launcher starts itself.
steps:
  - call: session.github
    as: github
  - call: github.createUser
    options: { login: ana-smoke }
    as: ana
  - call: github.createRepo
    options:
      collaborators: [$ana]
      labels: [bug]
      # Inline files go to the server as paths with base64 contents, in every SDK.
      files: [{ name: README.md, content: "# hi\n" }, { name: docs/setup.md, content: Run it. }]
    as: repo
  - expect:
      - { value: $ana.login, equals: ana-smoke }
      - { value: $ana.kind, equals: user }
      - { value: $repo.defaultBranch, equals: main }
      - { value: $repo.fullName, matches: "^[0-9A-Za-z-]+/test-[0-9a-z]+$" }
  - call: repo.readFile
    args: [README.md]
    as: readme
  - call: repo.readFile
    args: [docs/setup.md]
    as: setup
  - call: repo.readFile
    args: [missing.md]
    as: missing
  - expect:
      - { value: $readme, equals: "# hi\n" }
      - { value: $setup, equals: Run it. }
      - { value: $missing, equals: null }

  - call: ana.openIssue
    args: [{ title: The login page is blank, body: Since the last deploy. }]
    options: { repo: $repo }
    as: issue
  - expect:
      - { value: $issue.number, equals: 1 }
      - { value: $issue.author.login, equals: ana-smoke }
      # The App isn't installed on the repository, so nothing is delivered to it.
      - { value: $issue.delivery, equals: null }

  - call: ana.label
    args: [bug]
    options: { issue: $issue }
  - call: issue.labels
    as: labels
  - expect:
      - { value: $labels, equals: [bug] }

  - call: ana.comment
    args: ["Steps: open /login."]
    options: { issue: $issue }
    as: comment
  - call: issue.comments
    as: comments
  - expect:
      - { value: $comments.length, equals: 1 }
      - { value: $comments.0.body, equals: "Steps: open /login." }
      - { value: $comments.0.author.login, equals: ana-smoke }
      - { value: $comments.0.id, equals: $comment.id }

  - call: ana.close
    options: { issue: $issue }
  - call: issue.state
    as: state
  - expect:
      - { value: $state, equals: closed }

  # The same issue read back by its number, and one that isn't there.
  - call: repo.issue
    args: [1]
    as: again
  - expect:
      - { value: $again.url, equals: $issue.url }
  - call: repo.issue
    args: [2]
    throws: not_found
