name: Prepare a release

# Step one of a release (docs/release.md): run it from the Actions tab with the version. It sets
# that version in every package, regenerates what follows from it, moves the changelog's
# "Unreleased" section under the version, and opens the version pull request. Merging that pull
# request tags it (release-tag.yml), and the tag releases it (release.yml).
#
# The pull request is opened with the release App's token, not GITHUB_TOKEN: a pull request that
# GITHUB_TOKEN opens starts no workflows, so it would get no CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release: X.Y.Z, or X.Y.Z-alpha.N, -beta.N or -rc.N"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  BUN_VERSION: 1.4.5
  UV_VERSION: 0.13.1

jobs:
  prepare:
    name: the version pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-bot
    steps:
      - name: The version is one a release can have, and isn't released yet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::\"$VERSION\" isn't X.Y.Z or X.Y.Z-(alpha|beta|rc).N"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is released already"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Every package at the version, the spec, SDKs and lock files regenerated
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm release:version "$VERSION"

      # The App's token comes last, after every step that runs the dependencies' code.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit, push and open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          branch="release/v$VERSION"
          bot="${APP_SLUG}[bot]"
          id="$(gh api "users/$bot" --jq .id)"
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"
          # git asks gh for credentials, and gh reads GH_TOKEN: the token is on no command line.
          gh auth setup-git
          git switch -c "$branch"
          git add -A
          git commit -q -m "chore: release v$VERSION"
          git push origin "$branch"
          first=""
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq length)" = 0 ]; then
            first="- [ ] The first release: take the note that channelstack isn't on npm yet out of README.md."
          fi
          gh pr create --base main --head "$branch" --title "chore: release v$VERSION" --body "$(cat <<EOF
          Sets every package to $VERSION, regenerates the spec, the SDKs and the lock files, and moves
          the changelog's "Unreleased" section under $VERSION. Opened by the **Prepare a release** workflow.

          - [ ] The changelog's $VERSION section reads well (edit it on this branch).
          $first

          Merging this tags the merge commit \`v$VERSION\`, and the tag starts the release. Its
          publishing jobs wait for your approval in the \`release\` and \`pypi\` environments.
          EOF
          )"
