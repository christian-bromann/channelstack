name: Live

# Exit checks 5.1 and 5.2: every "live mode" block of the examples against the real sandboxes,
# then a sweep check that the run left nothing behind (`pnpm live`, scripts/live.ts).
#
# The credentials are secrets of the protected `live` environment. This workflow runs only on a
# schedule and by hand, never for a pull request, so a fork's code never sees them. A channel whose
# credentials aren't set skips its live block with the reason.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run at a time: the sandboxes are shared, and Slack's rate limits are per workspace.
  group: live
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  BUN_VERSION: 1.4.5

jobs:
  live:
    name: live mode (sandboxes)
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm live
        env:
          # The tag every object of this run carries, so the sweep check looks for exactly that.
          CHANNELSTACK_RUN_ID: gh${{ github.run_id }}
          CHANNELSTACK_LIVE_SLACK_TEAMS: ${{ vars.CHANNELSTACK_LIVE_SLACK_TEAMS }}
          CHANNELSTACK_SLACK_APP_ID: ${{ secrets.CHANNELSTACK_SLACK_APP_ID }}
          CHANNELSTACK_SLACK_BOT_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_BOT_TOKEN }}
          CHANNELSTACK_SLACK_APP_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_APP_TOKEN }}
          CHANNELSTACK_SLACK_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_USER_ANA_TOKEN }}
          CHANNELSTACK_LIVE_GITHUB_ORGS: ${{ vars.CHANNELSTACK_LIVE_GITHUB_ORGS }}
          CHANNELSTACK_GITHUB_APP_ID: ${{ secrets.CHANNELSTACK_GITHUB_APP_ID }}
          CHANNELSTACK_GITHUB_PRIVATE_KEY: ${{ secrets.CHANNELSTACK_GITHUB_PRIVATE_KEY }}
          CHANNELSTACK_GITHUB_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_GITHUB_USER_ANA_TOKEN }}
          CHANNELSTACK_LIVE_LINEAR_WORKSPACES: ${{ vars.CHANNELSTACK_LIVE_LINEAR_WORKSPACES }}
          CHANNELSTACK_LINEAR_APP_TOKEN: ${{ secrets.CHANNELSTACK_LINEAR_APP_TOKEN }}
          CHANNELSTACK_LINEAR_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_LINEAR_USER_ANA_TOKEN }}
          CHANNELSTACK_LIVE_NOTION_WORKSPACES: ${{ vars.CHANNELSTACK_LIVE_NOTION_WORKSPACES }}
          CHANNELSTACK_NOTION_TOKEN: ${{ secrets.CHANNELSTACK_NOTION_TOKEN }}
          CHANNELSTACK_NOTION_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_NOTION_USER_ANA_TOKEN }}
