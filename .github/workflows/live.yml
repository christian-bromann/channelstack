name: Live

# Exit checks 5.1 and 5.2: every "live mode" block of the examples against the real sandboxes,
# then a sweep check that the run left nothing behind (`pnpm live`, scripts/live.ts).
#
# The credentials are secrets of the protected `live` environment. This workflow runs only on a
# schedule and by hand, never for a pull request, so a fork's code never sees them. A channel whose
# credentials aren't set skips its live block with the reason.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run at a time: the sandboxes are shared, and Slack's rate limits are per workspace.
  group: live
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  BUN_VERSION: 1.4.5

jobs:
  live:
    name: live mode (sandboxes)
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: pnpm build
      - run: pnpm live
        env: &sandboxes # The tag every object of this run carries, so the sweep check looks for exactly that.
          CHANNELSTACK_RUN_ID: gh${{ github.run_id }}
          CHANNELSTACK_LIVE_SLACK_TEAMS: ${{ vars.CHANNELSTACK_LIVE_SLACK_TEAMS }}
          CHANNELSTACK_SLACK_APP_ID: ${{ secrets.CHANNELSTACK_SLACK_APP_ID }}
          CHANNELSTACK_SLACK_BOT_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_BOT_TOKEN }}
          CHANNELSTACK_SLACK_APP_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_APP_TOKEN }}
          CHANNELSTACK_SLACK_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_SLACK_USER_ANA_TOKEN }}
          # The people's saved browser sessions (channelstack login), for the browser actor.
          CHANNELSTACK_BROWSER_SESSIONS: ${{ secrets.CHANNELSTACK_BROWSER_SESSIONS }}
          CHANNELSTACK_LIVE_GITHUB_ORGS: ${{ vars.CHANNELSTACK_LIVE_GITHUB_ORGS }}
          CHANNELSTACK_GITHUB_APP_ID: ${{ secrets.CHANNELSTACK_GITHUB_APP_ID }}
          CHANNELSTACK_GITHUB_PRIVATE_KEY: ${{ secrets.CHANNELSTACK_GITHUB_PRIVATE_KEY }}
          CHANNELSTACK_GITHUB_USER_ANA_CHANNELSTACK_TOKEN: ${{ secrets.CHANNELSTACK_GITHUB_USER_ANA_CHANNELSTACK_TOKEN }}
          # The agents' side: what each reference agent checks deliveries with, and the relay
          # channel each platform sends its webhooks to (GitHub's is read from the App itself).
          CHANNELSTACK_GITHUB_WEBHOOK_SECRET: ${{ secrets.CHANNELSTACK_GITHUB_WEBHOOK_SECRET }}
          CHANNELSTACK_LIVE_LINEAR_WORKSPACES: ${{ vars.CHANNELSTACK_LIVE_LINEAR_WORKSPACES }}
          CHANNELSTACK_LINEAR_APP_TOKEN: ${{ secrets.CHANNELSTACK_LINEAR_APP_TOKEN }}
          CHANNELSTACK_LINEAR_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_LINEAR_USER_ANA_TOKEN }}
          CHANNELSTACK_LINEAR_RELAY_URL: ${{ secrets.CHANNELSTACK_LINEAR_RELAY_URL }}
          CHANNELSTACK_LINEAR_WEBHOOK_SECRET: ${{ secrets.CHANNELSTACK_LINEAR_WEBHOOK_SECRET }}
          CHANNELSTACK_LIVE_NOTION_WORKSPACES: ${{ vars.CHANNELSTACK_LIVE_NOTION_WORKSPACES }}
          CHANNELSTACK_NOTION_TOKEN: ${{ secrets.CHANNELSTACK_NOTION_TOKEN }}
          CHANNELSTACK_NOTION_USER_ANA_TOKEN: ${{ secrets.CHANNELSTACK_NOTION_USER_ANA_TOKEN }}
          CHANNELSTACK_NOTION_RELAY_URL: ${{ secrets.CHANNELSTACK_NOTION_RELAY_URL }}
          CHANNELSTACK_NOTION_VERIFICATION_TOKEN: ${{ secrets.CHANNELSTACK_NOTION_VERIFICATION_TOKEN }}
      # Exit check 6.4: the differential run, each scenario against the fake and the sandbox, and
      # 6.5: the coverage page with tonight's results.
      - run: pnpm conformance
        if: ${{ !cancelled() }}
        env: *sandboxes
      - run: pnpm coverage --results build/conformance/results.json --summary "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() && hashFiles('build/conformance/results.json') != '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            build/coverage/index.html
            build/conformance/results.json
          if-no-files-found: ignore
      # The people's saved sessions as this run left them, for the next run (#22). Slack renews a
      # session's cookies while it is used and retires the copy the run started with, so they are
      # saved back after every run, even a failed or cancelled one. The token may only write this
      # repository's environment secrets (a fine-grained token: Environments, read and write).
      - name: Save the renewed browser sessions
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.CHANNELSTACK_SECRETS_TOKEN }}
          # What the run started from: a session it didn't renew is uploaded again as it was.
          CHANNELSTACK_BROWSER_SESSIONS: ${{ secrets.CHANNELSTACK_BROWSER_SESSIONS }}
        run: |
          if [ ! -d "$HOME/.channelstack/browser" ]; then
            echo "No browser session was used, so there's nothing to save"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CHANNELSTACK_SECRETS_TOKEN isn't set, so the renewed browser sessions aren't saved; the next run's Slack steps will be signed out"
            exit 0
          fi
          pnpm live:secrets --sessions-only --repo "$GITHUB_REPOSITORY"
