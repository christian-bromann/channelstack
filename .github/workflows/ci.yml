name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The phase being built. `verify:phase` runs the gates of phase 0..n, so a later phase can't break an earlier one.
  PHASE: 12
  NODE_VERSION: 24.12.0
  BUN_VERSION: 1.4.5
  UV_VERSION: 0.13.1

jobs:
  # The gate (`pnpm verify:phase`) in pieces side by side, each well under five minutes: together
  # they are the whole gate. The acceptance suite runs as parts, each three times in its own job
  # (the flake check: three independent green runs).
  static:
    name: verify:phase static (types, lint, spec, SDKs, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm verify:phase "$PHASE" --group static

  unit:
    name: verify:phase unit (unit, integration, redaction, packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm verify:phase "$PHASE" --group unit

  accept:
    name: verify:phase accept (${{ matrix.part }}, run ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        part:
          [
            slack,
            github-linear,
            notion-shared-own,
            proxy,
            conformance,
            broken-slack,
            broken-others,
            resend,
            google,
            discord,
          ]
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm verify:phase "$PHASE" --group accept --part "${{ matrix.part }}" --repeat 1

  coverage:
    # Exit check 6.5: the coverage page, from the capabilities and the divergences (the nightly job
    # adds that night's results), on the job's summary and as an artifact.
    name: coverage page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: pnpm coverage --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage/index.html

  packaging:
    # Exit check 0.3: npm pack, install into an empty project, `npx channelstack --version`, the TS smoke scenario.
    name: packaging (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - name: The runner is the platform this job claims to test
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
      - run: pnpm build
      - run: pnpm test:pack

  packages:
    # The packages release.yml builds for PyPI and crates.io, built the same way on every pull
    # request: the release workflow runs for its tag only, and a fix after the tag costs a version.
    # (The npm package is packed and installed by `packaging` above.) Neither asks whether the version
    # is already published, so a released version doesn't fail it. Keep it in step with release.yml's
    # `packages` job.
    name: PyPI and crates.io packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: PyPI, channelstack and pytest-channelstack
        run: |
          uv build --project sdks/python --out-dir dist/python
          uv build --project integrations/pytest-channelstack --out-dir dist/python
          ls -l dist/python
      - name: crates.io, channelstack (packaged and built from what is packaged)
        run: cargo package -p channelstack --locked

  binaries:
    name: compile all five targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: pnpm build:binaries
      - name: Every target produced a binary and a package
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            test -f "dist/npm/server-$target/package.json"
            ls -l "dist/npm/server-$target/bin"
            test -n "$(ls "dist/npm/server-$target/bin")"
          done
          dist/npm/server-linux-x64/bin/channelstack --version
