name: Release

# One tag releases the server, the spec and every SDK at the same version (architecture.md,
# section 6; docs/release.md). A pushed tag `vX.Y.Z` builds, checks and publishes:
#   - npm: `@channelstack/server-<platform>` for each of the five targets, then `channelstack`;
#   - PyPI: `channelstack` and `pytest-channelstack`;
#   - crates.io: `channelstack`;
#   - a GitHub release with the five binaries, their checksums and the changelog's section.
# Nothing else starts it: the tag is pushed by release-tag.yml, once the version pull request that
# **Prepare a release** (release-prepare.yml, started by hand) opened is merged.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  BUN_VERSION: 1.4.5
  UV_VERSION: 0.13.1

jobs:
  check:
    name: every package at the tag's version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: The versions agree (and match the tag, which is on main, with a changelog section)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.ts check --tag "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG isn't on main"; exit 1; }
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "npm-tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "npm-tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  binaries:
    # Each binary is built on its own platform where a runner exists, and run there once. Windows'
    # is compiled on Linux, as CI's `binaries` job does, and run on Windows below.
    name: binary (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, runs: true }
          - { target: linux-arm64, os: ubuntu-24.04-arm, runs: true }
          - { target: darwin-arm64, os: macos-latest, runs: true }
          - { target: darwin-x64, os: macos-15-intel, runs: true }
          - { target: win32-x64, os: ubuntu-latest, runs: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: node scripts/build-binary.ts --target "$TARGET"
      - if: startsWith(matrix.target, 'darwin')
        name: Sign it ad hoc, as macOS runs no unsigned binary
        run: codesign --force --sign - "dist/npm/server-$TARGET/bin/channelstack"
      - if: matrix.runs
        name: It runs, and says its version
        run: test "$("dist/npm/server-$TARGET/bin/channelstack" --version)" = "$VERSION"
      - name: Its npm package and its archive for the GitHub release
        # Packed here, where the binary is still executable: artifacts don't keep file modes.
        run: |
          mkdir -p dist/packs dist/release
          npm pack "./dist/npm/server-$TARGET" --pack-destination dist/packs
          if [ "$TARGET" = win32-x64 ]; then
            (cd "dist/npm/server-$TARGET/bin" && zip -q "$GITHUB_WORKSPACE/dist/release/channelstack-$VERSION-$TARGET.zip" channelstack.exe)
          else
            tar -czf "dist/release/channelstack-$VERSION-$TARGET.tar.gz" -C "dist/npm/server-$TARGET/bin" channelstack
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: |
            dist/packs/
            dist/release/
          if-no-files-found: error

  windows:
    name: binary (win32-x64) runs on Windows
    needs: [check, binaries]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-win32-x64
      - name: It runs, and says its version
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          Expand-Archive -Path "release/channelstack-$env:VERSION-win32-x64.zip" -DestinationPath bin
          $out = (& .\bin\channelstack.exe --version).Trim()
          if ($out -ne $env:VERSION) { throw "channelstack.exe --version said '$out', not '$env:VERSION'" }

  packages:
    # Everything that isn't a binary, built and checked the way the registries will take it.
    name: npm, PyPI and crates.io packages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: npm, channelstack
        run: |
          pnpm build:sdk
          mkdir -p dist/packs
          npm pack ./sdks/typescript --pack-destination dist/packs
          # From where the npm job publishes, with the path it uses (a leading ./: npm reads
          # "packs/x.tgz" as the GitHub repository packs/x.tgz).
          (cd dist && npm publish --dry-run "./packs/channelstack-$VERSION.tgz")
      - name: PyPI, channelstack and pytest-channelstack
        run: |
          uv build --project sdks/python --out-dir dist/python
          uv build --project integrations/pytest-channelstack --out-dir dist/python
          ls -l dist/python
      - name: crates.io, channelstack (packaged and built from what is packaged)
        run: cargo package -p channelstack --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/packs/
            dist/python/
          if-no-files-found: error

  npm:
    name: publish to npm
    needs: [check, binaries, windows, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm's trusted publishing, which npm tries first, and its provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NPM_TAG: ${{ needs.check.outputs.npm-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: The platform packages first, then channelstack, which names them
        env:
          # Only for a package that doesn't trust this workflow yet (docs/release.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            name="$(tar -xOzf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            # A release run again after a failure: what is on npm already stays.
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then echo "$name@$VERSION is on npm already"; return; fi
            npm publish "$1" --provenance --access public --tag "$NPM_TAG"
          }
          # A leading ./: npm reads "packs/x.tgz" as the GitHub repository packs/x.tgz.
          for pack in ./packs/channelstack-server-*.tgz; do publish "$pack"; done
          publish "./packs/channelstack-$VERSION.tgz"

  pypi:
    name: publish to PyPI
    needs: [check, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI's trusted publishing: no token is stored
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      # `--check-url`: files PyPI has already are skipped, so a release can be run again.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ python/*

  crate:
    name: publish to crates.io
    needs: [check, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo publish (rust-toolchain.toml picks the toolchain)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if curl -sf -A "channelstack-release" "https://crates.io/api/v1/crates/channelstack/$VERSION" > /dev/null; then
            echo "channelstack $VERSION is on crates.io already"
          else
            cargo publish -p channelstack --locked
          fi

  github:
    name: GitHub release
    needs: [check, npm, pypi, crate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the release and its assets
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
      - name: The binaries, their checksums, the spec and the changelog's section
        run: |
          cp spec/openapi.json "release/channelstack-$VERSION-openapi.json"
          (cd release && sha256sum -- * > SHA256SUMS)
          node scripts/release.ts notes "$VERSION" > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --verify-tag --title "channelstack $VERSION" --notes-file notes.md "${flags[@]}"
