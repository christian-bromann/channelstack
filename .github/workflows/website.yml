# The channelstack.dev website (website/): checks, preview versions for branches and
# production deploys from main. Hosted on Cloudflare Workers static assets.
name: Website

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  # A pull request opened after the branch's last push still gets its preview comment.
  pull_request:
    types: [opened, reopened]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: website

env:
  # Actions never interpolate the branch name into a script; steps read it from here.
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  preview:
    name: Checks and preview
    # Branch pushes, and pull requests from this repository (forks get no secrets).
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: website-preview-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:samples
      - run: pnpm build

      - name: Create the Worker if it doesn't exist yet
        # `wrangler versions upload` can't create a Worker. The first run creates it on
        # workers.dev only; the custom domain is attached by the production deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler deployments status > /dev/null 2>&1; then
            pnpm exec wrangler deploy --config wrangler.bootstrap.jsonc
          fi

      - name: Upload a preview version
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The alias becomes a DNS label: <alias>-channelstack-website.<subdomain>.workers.dev.
          # Lowercase letters, digits and dashes; starts with a letter; short enough for 63 characters.
          alias="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          case "$alias" in [a-z]*) ;; *) alias="b-$alias" ;; esac
          if [ "${#alias}" -gt 40 ]; then
            alias="$(printf '%s' "$alias" | cut -c1-32 | sed -E 's/-+$//')-$(printf '%s' "$BRANCH" | sha256sum | cut -c1-7)"
          fi
          pnpm exec wrangler versions upload --preview-alias "$alias" --message "$BRANCH @ ${GITHUB_SHA::7}" | tee upload.log
          url="$(grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a preview alias URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH; nothing to comment on."
            exit 0
          fi
          marker="<!-- website-preview -->"
          body="$(printf '%s\n**Website preview:** %s\n\nBuilt from `%s`. This comment is updated on every push.' "$marker" "$PREVIEW_URL" "${GITHUB_SHA::7}")"
          comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty" | head -n 1)"
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" > /dev/null
          fi

  production:
    name: Checks and production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production deploys never overlap, and a running deploy is never cancelled.
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:samples
      - run: pnpm build
      - name: Deploy to channelstack.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
