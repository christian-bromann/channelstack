name: Set up channelstack
description: Node, pnpm, Bun, Rust and (optionally) uv at the versions CI pins, with the dependencies installed.
inputs:
  python:
    description: Also set up uv and the Python SDK's environment.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: ${{ env.UV_VERSION }}
    # The Rust toolchain comes from rust-toolchain.toml when cargo first runs; its builds are cached.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.python == 'true'
      run: uv sync --project sdks/python --frozen
      shell: bash
