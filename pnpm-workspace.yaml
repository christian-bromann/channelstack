packages:
  - server
  - codegen
  - sdks/typescript

# esbuild arrives through vite, which Vitest depends on. Nothing here bundles with it, so its install
# script isn't needed.
allowBuilds:
  # The bun package fetches the Bun binary for this platform when it installs.
  bun: true
  esbuild: false
  # WebdriverIO brings drivers for every browser. The UI test runs in Chrome, whose driver needs no
  # install script, so the Edge and Firefox drivers aren't downloaded.
  edgedriver: false
  geckodriver: false

# The TypeScript SDK names the server binary for each platform as an optional dependency, at its own
# version. Here the binary is built from source (scripts/build-binary.ts), so the published ones are
# never resolved: the lockfile doesn't depend on the version, and a release isn't on npm yet when its
# version pull request is checked.
ignoredOptionalDependencies:
  - "@channelstack/server-darwin-arm64"
  - "@channelstack/server-darwin-x64"
  - "@channelstack/server-linux-arm64"
  - "@channelstack/server-linux-x64"
  - "@channelstack/server-win32-x64"
