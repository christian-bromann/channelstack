<!doctype html>
<!-- Source of public/og.png (1200×630) and public/apple-touch-icon.png. Render with `pnpm og`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/familjen-grotesk/wght.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/latin-400.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #090b0f;
        color: #eef1f6;
        font-family: "Familjen Grotesk Variable", sans-serif;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 70% at 85% 0%, rgba(245, 168, 60, 0.22), transparent 70%),
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 60px 60px;
      }
      main {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 72px 80px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #10141b;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      .mark i {
        width: 4px;
        border-radius: 2px;
        background: #f5a83c;
      }
      h1 {
        margin-top: auto;
        font-size: 104px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      h1 em {
        color: #f5a83c;
        font-style: normal;
      }
      p {
        margin-top: 34px;
        color: #9aa4b5;
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
      }
      body.icon {
        width: 180px;
        height: 180px;
        background: #10141b;
      }
      body.icon main,
      body.icon .bg {
        display: none;
      }
      .icon-mark {
        display: none;
      }
      body.icon .icon-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        width: 180px;
        height: 180px;
      }
      .icon-mark i {
        width: 14px;
        border-radius: 7px;
        background: #f5a83c;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <main>
      <div class="brand">
        <span class="mark"
          ><i style="height: 16px"></i><i style="height: 28px"></i><i style="height: 20px"></i
          ><i style="height: 32px"></i><i style="height: 12px"></i
        ></span>
        channelstack
      </div>
      <h1>Your agent’s whole world, <em>on localhost.</em></h1>
      <p>Test harness for AI agents in Slack, GitHub, Linear and Notion</p>
    </main>
    <div class="icon-mark">
      <i style="height: 56px"></i><i style="height: 96px"></i><i style="height: 68px"></i><i style="height: 112px"></i
      ><i style="height: 40px"></i>
    </div>
    <script>
      if (location.hash === "#icon") document.body.className = "icon";
    </script>
  </body>
</html>
