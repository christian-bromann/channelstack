[package]
name = "channelstack-docs-examples"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Rust versions of the docs' test examples: compiled by `pnpm test:rust`, run against a running agent"

[dependencies]
channelstack = { path = "../../../sdks/rust" }
regex = "=1.13.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
