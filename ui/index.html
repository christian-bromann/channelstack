<!doctype html>
<!--
  The channelstack UI, v0: the dev session's places on every channel (Slack channels, GitHub and
  Linear issues, Notion pages, email threads) as a person would read them, and an inspector for what
  went to the agent and what the agent called. One page, no build step. It only reads; everything it
  shows comes from the control API, the same data the matchers read. The server fills in __NONCE__
  (this response's CSP nonce), __SESSION__ (the dev session) and the JSON in #channels: each
  channel's listing from its dev adapter (`core/dev`), the same declaration the CLI and MCP list
  places with.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>channelstack</title>
    <style nonce="__NONCE__">
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --quiet: color-mix(in srgb, currentColor 60%, transparent);
        --accent: #3b6fd4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      header { display: flex; gap: 1rem; align-items: baseline; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 1rem; margin: 0; }
      header span { color: var(--quiet); }
      main { display: grid; grid-template-columns: 14rem minmax(0, 1fr) minmax(0, 26rem); min-height: 0; }
      section { overflow: auto; padding: 0.8rem 1rem; border-right: 1px solid var(--line); }
      h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--quiet); margin: 0 0 0.6rem; }
      ul { list-style: none; margin: 0; padding: 0; }
      nav button { all: unset; display: block; width: 100%; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; }
      nav button[aria-current="true"] { background: var(--accent); color: white; }
      nav h2 + ul { margin-bottom: 0.8rem; }
      .entry { padding: 0.3rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .entry .author { font-weight: 600; }
      .entry .app { color: var(--accent); }
      .entry .marks, .empty, time { color: var(--quiet); font-size: 0.85em; }
      .entry button { margin: 0.2rem 0.3rem 0 0; }
      details { border-bottom: 1px solid var(--line); padding: 0.25rem 0; }
      summary { cursor: pointer; font-family: ui-monospace, monospace; font-size: 0.8rem; overflow-wrap: anywhere; }
      summary .failed { color: #c0392b; }
      pre { margin: 0.4rem 0; font-size: 0.75rem; overflow: auto; }
    </style>
  </head>
  <body data-session="__SESSION__">
    <header>
      <h1>channelstack</h1>
      <span id="status">connecting…</span>
    </header>
    <main>
      <section>
        <nav aria-label="Places" id="conversations" data-testid="conversations"></nav>
      </section>
      <section aria-label="Transcript">
        <h2 id="title">Transcript</h2>
        <div id="transcript" data-testid="transcript"></div>
      </section>
      <section aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="inspector" data-testid="inspector"></div>
      </section>
    </main>
    <script type="application/json" id="channels">["__CHANNELS__"]</script>
    <script type="module" nonce="__NONCE__">
      const session = encodeURIComponent(document.body.dataset.session);
      const api = async (path) => {
        const response = await fetch(`/_channelstack/sessions/${session}${path}`);
        if (!response.ok) throw new Error(`${response.status} for ${path}`);
        return response.json();
      };
      // Everything an agent or a person wrote is set as text, never as markup.
      const element = (tag, text, className) => {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      };
      const $ = (id) => document.getElementById(id);

      // Each channel's listing, as its dev adapter declares it: where its places are listed, and
      // templates (`{field.path}`) for a place's id, its name and its transcript route.
      const channels = JSON.parse($("channels").textContent);
      const field = (item, path) => path.split(".").reduce((value, key) => value?.[key], item);
      const fill = (template, item, encode) => {
        let missing = false;
        const text = template.replace(/\{([\w.]+)\}/g, (_, path) => {
          const value = field(item, path);
          if (value === undefined || value === null || value === "") missing = true;
          return encode ? encodeURIComponent(String(value ?? "")) : String(value ?? "");
        });
        return missing ? undefined : text;
      };

      let chosen; // The place the person picked (`<channel>/<id>`); the most recently active one until they do.
      let shown = ""; // What the transcript pane last rendered, to leave it alone while nothing changes.
      let cursor; // How far into the event log the inspector has read.

      async function placesOf({ name, title, listing }) {
        const items = await api(`/${name}${listing.path}`);
        return items.map((item) => {
          const id = fill(listing.id, item, false) ?? "";
          return {
            key: `${name}/${id}`,
            title,
            label: listing.name.map((template) => fill(template, item, false)).find((text) => text !== undefined) ?? id,
            transcript: `/${name}${fill(listing.transcript, item, true)}`,
          };
        });
      }

      /** The newest entry's time of a place, to find the most recently active one. */
      async function newest(place) {
        const { entries } = await api(place.transcript);
        return entries.map((entry) => entry.at).sort().at(-1) ?? "";
      }

      async function conversations() {
        const listed = await Promise.all(channels.map(async (channel) => ({ channel, places: await placesOf(channel) })));
        let current = listed.flatMap(({ places }) => places).find((place) => place.key === chosen);
        if (!current) {
          // Each channel's most recently active place is among its last ones; the newest of those wins.
          let latest = "";
          for (const { places } of listed) {
            const last = places.at(-1);
            const at = last ? await newest(last) : "";
            if (last && at >= latest) [current, latest] = [last, at];
          }
        }
        $("conversations").replaceChildren(
          ...listed
            .filter(({ places }) => places.length > 0)
            .flatMap(({ channel, places }) => {
              const list = element("ul");
              list.append(
                ...places.toReversed().map((place) => {
                  const button = element("button", place.label);
                  button.setAttribute("aria-current", String(place.key === current?.key));
                  button.addEventListener("click", () => {
                    chosen = place.key;
                    refresh();
                  });
                  const item = element("li");
                  item.append(button);
                  return item;
                }),
              );
              return [element("h2", channel.title), list];
            }),
        );
        return current;
      }

      async function transcript(place) {
        if (!place) {
          $("title").textContent = "Transcript";
          $("transcript").replaceChildren(
            element("p", 'Nothing yet. Try: channelstack slack say --as ana --in "#support" "@my-agent hi"', "empty"),
          );
          return;
        }
        const { entries } = await api(place.transcript);
        const signature = place.key + JSON.stringify(entries);
        if (signature === shown) return;
        shown = signature;
        $("title").textContent = `${place.title}: ${place.label}`;
        $("transcript").replaceChildren(
          ...entries.map((entry) => {
            const row = element("div", undefined, "entry");
            row.style.marginLeft = `${entry.depth * 1.5}rem`;
            row.append(element("span", entry.author.name, `author ${entry.author.kind}`), element("span", `: ${entry.text}`));
            const marks = [
              entry.edited ? "edited" : "",
              entry.streaming === "open" ? "streaming…" : (entry.streaming ?? ""),
              entry.visibleTo ? `only ${entry.visibleTo.name} sees this` : "",
            ].filter(Boolean);
            if (marks.length > 0) row.append(element("span", ` (${marks.join(", ")})`, "marks"));
            if (entry.controls.length > 0) {
              const controls = element("div");
              // Shown, not clickable yet: acting from the UI comes with the interactivity phase.
              for (const control of entry.controls) controls.append(Object.assign(element("button", control), { disabled: true }));
              row.append(controls);
            }
            return row;
          }),
        );
      }

      async function inspector() {
        const page = await api(`/events${cursor === undefined ? "" : `?since=${encodeURIComponent(cursor)}`}`);
        cursor = page.cursor;
        for (const event of page.events) {
          // The server summarizes delivery attempts and API calls; the rest is bookkeeping.
          const line = event.summary;
          if (!line) continue;
          const details = element("details");
          const summary = element("summary");
          summary.append(
            element("time", `${event.at.slice(11, 23)} `),
            element("span", `${line.text}  `),
            element("span", line.outcome, line.ok ? "" : "failed"),
          );
          details.append(summary, element("pre", JSON.stringify(event.data, null, 2)));
          $("inspector").append(details);
        }
      }

      async function refresh() {
        try {
          await transcript(await conversations());
          await inspector();
          $("status").textContent = `session ${document.body.dataset.session}`;
        } catch (error) {
          $("status").textContent = `not connected (${error.message})`;
        }
      }

      await refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
