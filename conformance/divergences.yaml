# Known differences between a fake and its real platform (implementation plan 9.1, exit check 6.4).
#
# The nightly differential run compares each scenario in scenarios/<channel>/ against the fake and
# against the sandbox, and the shape of every exchange and webhook both saw (scenario
# shapes/<channel>). A difference listed here, with a reason and a date it expires, doesn't fail the
# run; after that date it does again, until someone looks at it. Everything else is fixed in the
# fake. The unit tests check this file in every CI run (`conformance/conformance.test.ts`).
#
#   - scenario: slack/mention        # the scenario's name
#     path: replies.0.blocks         # where it differs, a prefix ending in .*, or a list of them
#     reason: One sentence on why the fake may differ here.
#     expires: 2027-03-01            # YYYY-MM-DD
divergences:
  - scenario: shapes/github
    path:
      - "api POST /app/installations/{n}/access_tokens permissions.administration"
      - "api POST /repos/{owner}/{repo}/issues/{n}/comments minimized"
      - "api POST /repos/{owner}/{repo}/issues/{n}/comments performed_via_github_app"
      - "api POST /repos/{owner}/{repo}/issues/{n}/comments pin"
      - "webhook installation_repositories added installation.permissions.administration"
      - "webhook issue_comment created comment.minimized"
      - "webhook issue_comment created comment.performed_via_github_app"
      - "webhook issue_comment created comment.pin"
      - "webhook issue_comment created issue.issue_dependencies_summary"
      - "webhook issue_comment created issue.issue_field_values"
      - "webhook issue_comment created issue.pinned_comment"
      - "webhook issue_comment created issue.sub_issues_summary"
      - "webhook issue_comment created issue.type"
      - "webhook issue_comment created repository.custom_properties"
      - "webhook issue_comment created repository.description"
      - "webhook issue_comment created repository.has_pull_requests"
      - "webhook issue_comment created repository.pull_request_creation_policy"
      - "webhook issues opened issue.issue_dependencies_summary"
      - "webhook issues opened issue.issue_field_values"
      - "webhook issues opened issue.pinned_comment"
      - "webhook issues opened issue.status"
      - "webhook issues opened issue.sub_issues_summary"
      - "webhook issues opened issue.type"
      - "webhook issues opened repository.custom_properties"
      - "webhook issues opened repository.description"
      - "webhook issues opened repository.has_pull_requests"
      - "webhook issues opened repository.pull_request_creation_policy"
      - "webhook installation_repositories added sender.type"
    reason: >-
      GitHub's payloads have gained fields the fake doesn't send yet (issue types, status,
      sub-issue and dependency summaries, pins, repository policies, the administration
      permission), and an App's own comment names the App in performed_via_github_app, and a repository the installation adds has the App's bot as its sender. To add to
      the fake, against the pinned schemas: #25.
    expires: 2027-02-28
  - scenario: shapes/linear
    path:
      - "api POST /graphql issue data.issue.addedToTeamAt"
      - "api POST /graphql issue data.issue.assignee"
      - "api POST /graphql issue data.issue.slaType"
      - "api POST /graphql issue data.issue.syncedWith"
      - "api POST /graphql team data.team.allMembersCanJoin"
      - "api POST /graphql team data.team.autoClosePeriod"
      - "api POST /graphql team data.team.autoCloseStateId"
      - "api POST /graphql team data.team.color"
      - "api POST /graphql team data.team.defaultIssueState"
      - "api POST /graphql team data.team.markedAsDuplicateWorkflowState"
      - "webhook AgentSessionEvent created agentSession.comment"
      - "webhook AgentSessionEvent created agentSession.commentId"
      - "webhook AgentSessionEvent created agentSession.context"
      - "webhook AgentSessionEvent created agentSession.dismissedAt"
      - "webhook AgentSessionEvent created agentSession.dismissedById"
      - "webhook AgentSessionEvent created agentSession.externalLink"
      - "webhook AgentSessionEvent created agentSession.externalUrls"
      - "webhook AgentSessionEvent created agentSession.lastAgentReplyAt"
      - "webhook AgentSessionEvent created agentSession.modelSelection"
      - "webhook AgentSessionEvent created agentSession.plan"
      - "webhook AgentSessionEvent created agentSession.pullRequestId"
      - "webhook AgentSessionEvent created agentSession.slugId"
      - "webhook AgentSessionEvent created agentSession.sourceMetadata"
      - "webhook AgentSessionEvent created agentSession.workspaceDiff"
      - "webhook AgentSessionEvent created agentSession.availableSkills"
      - "webhook AgentSessionEvent created agentActivity.sourceCommentId"
      - "webhook AgentSessionEvent created agentActivity.sourceMetadata"
      - "webhook AgentSessionEvent created agentActivity.executionSkippedReason"
      - "webhook AgentSessionEvent created agentActivity.ephemeral"
      - "webhook AgentSessionEvent created agentActivity.pushSummary"
      - "webhook AgentSessionEvent created agentActivity.queued"
      - "webhook AgentSessionEvent created agentActivity.sentAt"
      - "api POST /graphql team_states data.team.states.nodes.[].type"
    reason: >-
      Real Linear's AgentSessionEvent on delegation carries the comment thread it opens for the
      session (comment, commentId, and the opening prompt's sourceCommentId) and sourceMetadata,
      which AgentSessionWebhookPayload declares, and fields that neither it nor
      AgentActivityWebhookPayload declares (slugId, plan, context, availableSkills, and the
      activity's ephemeral, queued, sentAt and others; some are on the GraphQL types), which an
      agent typed against @linear/sdk's webhook types can't read; real teams and issues fill fields
      the fake leaves null. To add to the fake, once a recording shows their values: #26.
    expires: 2027-02-28
  - scenario: shapes/resend
    path:
      - "api GET /emails/receiving/{id} headers.x-kumoref"
      - "api GET /emails/receiving/{id} headers.feedback-id"
      - "api GET /emails/receiving/{id} headers.x-ses-outgoing"
    reason: >-
      Headers Resend's and Amazon SES's own mail servers add on the way (KumoMTA's reference, SES's
      feedback id and outgoing marker); an agent doesn't read them, and their values are theirs.
    expires: 2027-02-28
  - scenario: shapes/resend
    path: api GET /emails/receiving/{id} headers.x-channelstack-run
    reason: >-
      Live mode tags the email a person sends with the run (`X-Channelstack-Run`); the fake's
      people send none. Where live mode marks its mail, not drift.
    expires: 2027-02-28
  - scenario: shapes/resend
    path: api GET /emails/receiving/{id} raw
    reason: >-
      Real Resend links the received email's raw MIME message (`raw.download_url`); the fake
      answers `raw: null`, which Resend's description allows. Building the raw message comes with
      attachments.
    expires: 2027-02-28
  - scenario: shapes/google
    path: api POST /token refresh_token_expires_in
    reason: >-
      Google answers a refresh token's remaining lifetime only when the token has one: access
      granted for a time, or an OAuth client whose consent screen is still in Testing (its refresh
      tokens last 7 days), as the sandbox's is. The fake's client is a published one, whose tokens
      don't expire.
    expires: 2027-02-28
  - scenario: shapes/notion
    path:
      - "api GET /v1/blocks/{id}/children results.[].child_page"
      - "api GET /v1/blocks/{id}/children results.[].paragraph.icon"
      - "api PATCH /v1/blocks/{id}/children results.[].paragraph.icon"
      - "api GET /v1/blocks/{id}/children results.[].type"
    reason: >-
      Real Notion lists a page's child pages among its blocks as child_page blocks, and a paragraph
      block has an icon (null); the fake's lists have neither. To look at: #70.
    expires: 2027-02-28
  - scenario: shapes/notion
    path: webhook page.created data.parent.type
    reason: >-
      Live, a session's pages go under a page of its own (so they are tagged and trashed with the
      session), and their parent is a page; in the fake, a page without a parent is at the
      workspace's top level. Where live mode puts pages, not drift.
    expires: 2027-02-28
