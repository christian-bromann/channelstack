# Known differences between a fake and its real platform (implementation plan 9.1, exit check 6.4).
#
# The nightly differential run compares each scenario in scenarios/<channel>/ against the fake and
# against the sandbox, and the shape of every exchange and webhook both saw (scenario
# shapes/<channel>). A difference listed here, with a reason and a date it expires, doesn't fail the
# run; after that date it does again, until someone looks at it. Everything else is fixed in the
# fake. The unit tests check this file in every CI run (`conformance/conformance.test.ts`).
#
#   - scenario: slack/mention        # the scenario's name
#     path: replies.0.blocks         # where it differs, a prefix ending in .*, or a list of them
#     reason: One sentence on why the fake may differ here.
#     expires: 2027-03-01            # YYYY-MM-DD
divergences:
  - scenario: shapes/github
    path: webhook issues opened issue.status
    reason: >-
      Real GitHub's issues have gained a status (`{ id, name, category }`) that neither pinned
      schema (@octokit/openapi 24.0.0, @octokit/openapi-webhooks 12.2.0) declares, so neither its
      shape nor a plain issue's value can be checked against one yet. To add to the fake once a
      pinned schema describes it: #77.
    expires: 2027-02-28
  - scenario: shapes/github
    path:
      - "webhook issues opened repository.description"
      - "webhook issue_comment created repository.description"
    reason: >-
      Live mode makes each session's repository with a description saying it is channelstack's and
      goes away with the session; the fake's repositories have none (`null`), as one made without a
      description has. The difference comes from how live mode makes repositories, not from drift
      in the fake.
    expires: 2027-02-28
  - scenario: shapes/linear
    path:
      - "webhook AgentSessionEvent created agentSession.context"
      - "webhook AgentSessionEvent created agentSession.dismissedAt"
      - "webhook AgentSessionEvent created agentSession.dismissedById"
      - "webhook AgentSessionEvent created agentSession.externalLink"
      - "webhook AgentSessionEvent created agentSession.externalUrls"
      - "webhook AgentSessionEvent created agentSession.lastAgentReplyAt"
      - "webhook AgentSessionEvent created agentSession.modelSelection"
      - "webhook AgentSessionEvent created agentSession.plan"
      - "webhook AgentSessionEvent created agentSession.pullRequestId"
      - "webhook AgentSessionEvent created agentSession.slugId"
      - "webhook AgentSessionEvent created agentSession.workspaceDiff"
      - "webhook AgentSessionEvent created agentSession.availableSkills"
      - "webhook AgentSessionEvent created agentActivity.sourceMetadata"
      - "webhook AgentSessionEvent created agentActivity.executionSkippedReason"
      - "webhook AgentSessionEvent created agentActivity.ephemeral"
      - "webhook AgentSessionEvent created agentActivity.pushSummary"
      - "webhook AgentSessionEvent created agentActivity.queued"
      - "webhook AgentSessionEvent created agentActivity.sentAt"
    reason: >-
      Real Linear's AgentSessionEvent carries fields that neither AgentSessionWebhookPayload nor
      AgentActivityWebhookPayload declares, in the committed schema or in @linear/sdk's webhook
      types (slugId, plan, context, availableSkills, and the activity's ephemeral, queued, sentAt
      and others; some are on the GraphQL types), so an agent typed against them can't read them.
      The fake sends what the payload types declare (#26).
    expires: 2027-02-28
  - scenario: shapes/resend
    path:
      - "api GET /emails/receiving/{id} headers.x-kumoref"
      - "api GET /emails/receiving/{id} headers.feedback-id"
      - "api GET /emails/receiving/{id} headers.x-ses-outgoing"
    reason: >-
      Headers Resend's and Amazon SES's own mail servers add on the way (KumoMTA's reference, SES's
      feedback id and outgoing marker); an agent doesn't read them, and their values are theirs.
    expires: 2027-02-28
  - scenario: shapes/resend
    path: api GET /emails/receiving/{id} headers.x-channelstack-run
    reason: >-
      Live mode tags the email a person sends with the run (`X-Channelstack-Run`); the fake's
      people send none. Where live mode marks its mail, not drift.
    expires: 2027-02-28
  - scenario: shapes/google
    path: api POST /token refresh_token_expires_in
    reason: >-
      Google answers a refresh token's remaining lifetime only when the token has one: access
      granted for a time, or an OAuth client whose consent screen is still in Testing (its refresh
      tokens last 7 days), as the sandbox's is. The fake's client is a published one, whose tokens
      don't expire.
    expires: 2027-02-28
  - scenario: shapes/notion
    path: webhook page.created data.parent.type
    reason: >-
      Live, a session's pages go under a page of its own (so they are tagged and trashed with the
      session), and their parent is a page; in the fake, a page without a parent is at the
      workspace's top level. Where live mode puts pages, not drift.
    expires: 2027-02-28
